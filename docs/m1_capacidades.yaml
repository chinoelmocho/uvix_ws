version_catalogo: 0.2.0
paquete_interfaces: uvix_interfaces
distro_ros: humble

capacidades:

  - id: personas
    nombre: Detección y seguimiento de personas
    descripcion: >
      Detecta cuerpos humanos en cámara/LiDAR y les asigna un track_id temporal.
      NO identifica a nadie: un track no es un paciente.
    entrada:
      - {nombre_ros: /camera/color/image_raw, tipo: sensor_msgs/msg/Image}
      - {nombre_ros: /camera/depth/points, tipo: sensor_msgs/msg/PointCloud2, opcional: true}
    salida:
      nombre_ros: /uvix/perception/person_tracks
      clase: topic
      tipo: vision_msgs/msg/Detection3DArray
      detalle_tipo: 'estándar; results[].hypothesis.class_id = "person", id = track_id'
      estado_interfaz: propuesta
      detalle_estado_interfaz: 'falta añadir vision_msgs como dependencia'
      qos: {reliability: best_effort, history: keep_last, depth: 5}
      frecuencia_hz: 10
    responsable:
      modulo: uvix_perception
      persona: por asignar
    consumidores: [rostros, posturas_gestos, uvix_interaction, mission_manager]
    timeout_s: 1.0
    detalle_timeout_s: 'sin mensajes en 1 s -> percepción no disponible'
    fallos:
      - {condicion: sin mensajes durante timeout_s, efecto: "SystemStatus DEGRADED con failed_components [person_tracker]"}
      - {condicion: oclusión breve (< max_age del tracker), efecto: se conserva el track_id}
      - {condicion: persona perdida más de max_age, efecto: se cierra el track; al reaparecer recibe un track_id NUEVO}
    version: 0.1.0
    alcance_m1: simulado
    detalle_alcance_m1: 'posiciones de personas inyectadas desde la simulación'
    modelo: pendiente

  - id: rostros
    nombre: Reconocimiento facial e identidad
    descripcion: >
      Compara el rostro de un track con los rostros registrados y emite una
      verificación de identidad para una petición (request_id). Es el
      componente confiable de identidad.
    entrada:
      - {nombre_ros: /camera/color/image_raw, tipo: sensor_msgs/msg/Image}
      - {nombre_ros: /uvix/perception/person_tracks, tipo: vision_msgs/msg/Detection3DArray}
      - {nombre_ros: /uvix/user_command, tipo: uvix_interfaces/msg/UserCommand, uso: saber qué request_id verificar}
    salida:
      - nombre_ros: /uvix/get_request_identity
        clase: srv
        tipo: uvix_interfaces/srv/GetRequestIdentity
        detalle_tipo: 'devuelve IdentityVerification'
        estado_interfaz: existe
        parametros: {verification_ttl_s: 60.0, min_confidence_verified: 0.90}
      - nombre_ros: /uvix/enroll_face
        clase: action
        tipo: uvix_interfaces/action/EnrollFace
        detalle_tipo: 'alta facial guiada; cancelable; RESULT_LOW_QUALITY / RESULT_INCOMPLETE; solo devuelve template_id, nunca biometría'
        estado_interfaz: existe
        parametros: {umbral_calidad: 0.8, max_rechazos: 3, muestras_por_defecto: 5}
    responsable:
      modulo: uvix_perception (identity_manager)
      persona: por asignar
    consumidores: [uvix_data (check_permission), mission_manager, command_interpreter]
    timeout_s: 2.0
    detalle_timeout_s: 'respuesta de GetRequestIdentity; EnrollFace dura lo que tarde la captura'
    fallos:
      - {condicion: servicio no responde en timeout_s, efecto: "CheckPermission CODE_IDENTITY_UNAVAILABLE (sin decisión) -> RegisterMission CODE_INTERNAL_ERROR; pedir ayuda se acepta igual"}
      - {condicion: sin verificación para ese request_id, efecto: found false -> CODE_IDENTITY_NOT_VERIFIED}
      - {condicion: confianza menor que el umbral, efecto: "IDENTITY_CANDIDATE; no autoriza nada (pedir ayuda nunca depende de la identidad)"}
      - {condicion: verificación vencida, efecto: CODE_IDENTITY_EXPIRED}
      - {condicion: rostro no registrado, efecto: IDENTITY_UNKNOWN con person_id vacío}
      - {condicion: alta facial cancelada, de baja calidad o incompleta, efecto: no se crea ninguna FaceTemplate}
    version: 0.2.0
    alcance_m1: simulado
    detalle_alcance_m1: >
      Identidad inyectada por un proveedor ficticio (uvix_data/test/identidad_ficticia.py);
      alta facial simulada sin cámara (ros2 run uvix_data uvix_enroll_face_sim).
      Reconocimiento y captura reales en M3 (UVIX-27).
    modelo: pendiente

  - id: posturas_gestos
    nombre: Posturas (caídas) y gestos
    descripcion: >
      Estima la postura de cada track para detectar caídas y reconoce gestos
      de solicitud de atención (mano levantada).
    entrada:
      - {nombre_ros: /camera/color/image_raw, tipo: sensor_msgs/msg/Image}
      - {nombre_ros: /uvix/perception/person_tracks, tipo: vision_msgs/msg/Detection3DArray}
    salida:
      - nombre_ros: /uvix/register_mission
        clase: srv
        tipo: uvix_interfaces/srv/RegisterMission
        detalle_tipo: 'caída -> mission_type attend_fall, origin ORIGIN_DETECTION'
        estado_interfaz: existe
      - nombre_ros: /uvix/user_command
        clase: topic
        tipo: uvix_interfaces/msg/UserCommand
        detalle_tipo: 'gesto -> modality MODALITY_GESTURE'
        estado_interfaz: existe
        qos: {reliability: reliable, history: keep_last, depth: 10}
    responsable:
      modulo: uvix_perception
      persona: por asignar
    consumidores: [mission_manager, command_interpreter]
    timeout_s: 2.0
    detalle_timeout_s: 'respuesta de RegisterMission'
    fallos:
      - {condicion: RegisterMission no responde, efecto: reintentar cada 1 s y publicar Alert EMERGENCY directamente}
      - {condicion: falsa caída, efecto: el personal la descarta con AckAlert; se registra para evaluación}
      - {condicion: gesto repetido del mismo track, efecto: una sola solicitud por ventana de repetición (UVIX-13)}
    version: 0.1.0
    alcance_m1: simulado
    detalle_alcance_m1: 'caída inyectada como llamada a RegisterMission; gesto fuera de M1 (M7)'
    modelo: pendiente

  - id: voz_entrada
    nombre: Voz de entrada (reconocimiento de habla)
    descripcion: >
      Convierte lo que dice una persona en texto y publica una orden por cada
      enunciado, con request_id nuevo.
    entrada:
      - {nombre_ros: /audio/raw, tipo: audio_common_msgs/msg/AudioData, opcional: true}
      - {nombre_ros: /uvix/user_command_text, tipo: std_msgs/msg/String, uso: entrada de texto para pruebas}
    salida:
      nombre_ros: /uvix/user_command
      clase: topic
      tipo: uvix_interfaces/msg/UserCommand
      estado_interfaz: existe
      qos: {reliability: reliable, history: keep_last, depth: 10}
    responsable:
      modulo: uvix_interaction (asr_node)
      persona: por asignar
    consumidores: [command_interpreter, rostros, CommandEvent (bitácora)]
    timeout_s: 10.0
    detalle_timeout_s: 'fin de enunciado: si no termina en 10 s se descarta'
    fallos:
      - {condicion: confianza baja, efecto: el interpreter publica ClarificationRequest REASON_LOW_CONFIDENCE}
      - {condicion: idioma no soportado, efecto: language vacío; el interpreter pide repetir}
      - {condicion: micrófono no disponible, efecto: "SystemStatus DEGRADED [microphone]; sigue la entrada de texto"}
    version: 0.1.0
    alcance_m1: simulado
    detalle_alcance_m1: 'órdenes escritas con ros2 topic pub; voz real en M3 (UVIX-12)'
    modelo: pendiente

  - id: voz_salida
    nombre: Voz de salida (síntesis de habla)
    descripcion: Hace hablar al robot; cancelable por emergencias.
    entrada:
      nombre_ros: /uvix/speak
      clase: action
      tipo: uvix_interfaces/action/SpeakText
      estado_interfaz: existe
    salida:
      - {nombre_ros: /audio/out, tipo: audio_common_msgs/msg/AudioData, opcional: true}
      - {descripcion: "resultado de la acción: RESULT_COMPLETED, CANCELED, TTS_UNAVAILABLE o LANGUAGE_UNSUPPORTED"}
    responsable:
      modulo: uvix_interaction (tts_node)
      persona: por asignar
    consumidores: [command_interpreter, mission_manager, ejecutor de misiones]
    timeout_s: 15.0
    detalle_timeout_s: 'por frase; si se excede se cancela la acción'
    fallos:
      - {condicion: TTS no disponible, efecto: RESULT_TTS_UNAVAILABLE; mostrar texto en pantalla si existe}
      - {condicion: emergencia mientras habla, efecto: se cancela si interruptible es true}
      - {condicion: idioma no soportado, efecto: RESULT_LANGUAGE_UNSUPPORTED}
    version: 0.1.0
    alcance_m1: simulado
    detalle_alcance_m1: 'nodo que imprime el texto en el log y responde COMPLETED'
    modelo: pendiente

  - id: personas_permisos
    nombre: Registro de personas y permisos
    descripcion: >
      Registro persistente de personas (person_id) con rol, estado activo y
      preferencias de interacción, y decisión de permisos por operación.
      NO dice quién está hablando: la identidad la aporta el componente de rostros.
    entrada:
      - {archivo: '~/.local/share/uvix/uvix.sqlite3 (UVIX_DATA_DB)', uso: 'base SQLite gestionada con Django; datos ficticios en M1'}
      - {nombre_ros: /uvix/get_request_identity, clase: srv, tipo: uvix_interfaces/srv/GetRequestIdentity, uso: identidad confiable de cada request_id}
    salida:
      - nombre_ros: /uvix/get_person
        clase: srv
        tipo: uvix_interfaces/srv/GetPerson
        detalle_tipo: 'status OK / NOT_FOUND / UNAVAILABLE + Person (person_id, display_name, role, active, preferences permitidas)'
        estado_interfaz: existe
      - nombre_ros: /uvix/check_permission
        clase: srv
        tipo: uvix_interfaces/srv/CheckPermission
        detalle_tipo: 'request_id + operation -> allowed + code (0-9 permitido, 10-19 denegado, 20-29 sin decisión)'
        estado_interfaz: existe
        parametros: {identity_service: /uvix/get_request_identity, identity_timeout_s: 2.0}
    responsable:
      modulo: uvix_data (uvix_data_node)
      persona: por asignar
    consumidores: [mission_manager, command_interpreter, uvix_interaction, rostros (enroll_face)]
    timeout_s: 1.0
    detalle_timeout_s: 'GetPerson; CheckPermission puede tardar hasta 3.0 s porque consulta la identidad (2.0 s)'
    fallos:
      - {condicion: person_id no existe, efecto: "status NOT_FOUND, found false, role ROLE_UNKNOWN -> CODE_NOT_AUTHORIZED"}
      - {condicion: base ilegible en marcha, efecto: "GetPerson status UNAVAILABLE / CheckPermission CODE_STORAGE_UNAVAILABLE; el nodo sigue vivo; el manager responde CODE_INTERNAL_ERROR (nunca asume un rol)"}
      - {condicion: servicio no responde, efecto: el manager rechaza con CODE_INTERNAL_ERROR (nunca asume un rol)}
      - {condicion: base inexistente o sin migrar al arrancar, efecto: "no ofrece servicios, log con la orden migrate y código 1"}
      - {condicion: pedir ayuda (attend_help_request), efecto: "siempre allowed (CODE_ALLOWED o CODE_ALLOWED_HELP), aunque falle la identidad, el registro o la base"}
    version: 0.2.0
    alcance_m1: implementado
    detalle_alcance_m1: >
      Django + SQLite con personas ficticias (UVIX-15, UVIX-26). Catálogo de
      operaciones y permisos por rol cargados por la migración 0004. Preparado
      para PostgreSQL sin cambiar las interfaces.
    modelo: no_aplica

# Operaciones que una persona puede SOLICITAR (Capability en uvix_data).
# No son capacidades técnicas: cada una se autoriza con /uvix/check_permission.
# Fuente de verdad: uvix_data/people/migrations/0004_catalogo_inicial.py.
operaciones_solicitables:
  - {codigo: deliver_item,        roles: [STAFF],          ejecutor: 'contrato MissionSpec; ejecutor pendiente'}
  - {codigo: reminder_round,      roles: [STAFF],          ejecutor: 'contrato MissionSpec; ejecutor pendiente', nota: 'siempre para un grupo'}
  - {codigo: find_person,         roles: [STAFF],          ejecutor: solo registrada}
  - {codigo: operational_report,  roles: [STAFF],          ejecutor: solo registrada}
  - {codigo: socialize_zone,      roles: [STAFF],          ejecutor: solo registrada}
  - {codigo: dispense_medication, roles: [STAFF],          ejecutor: solo registrada, nota: 'solo autorización con datos ficticios; sin dosis ni decisiones clínicas'}
  - {codigo: list_patients,       roles: [STAFF],          ejecutor: solo registrada}
  - {codigo: dispense_vitamins,   roles: [STAFF],          ejecutor: 'contrato MissionSpec; ejecutor pendiente'}
  - {codigo: attend_help_request, roles: [TODOS],          ejecutor: 'contrato MissionSpec; ejecutor pendiente', nota: 'nunca se deniega'}
  - {codigo: dance,               roles: [PATIENT, STAFF], ejecutor: 'contrato MissionSpec; ejecutor pendiente'}
  - {codigo: chat,                roles: [PATIENT, STAFF], ejecutor: 'contrato MissionSpec; ejecutor pendiente'}
  - {codigo: personal_reminder,   roles: [PATIENT, STAFF], ejecutor: 'contrato MissionSpec; ejecutor pendiente', nota: 'recordatorio individual, sin grupo'}
  - {codigo: enroll_face,         roles: [],               ejecutor: 'uvix_enroll_face_sim (simulado)'}
# El mission_manager no guarda personas ni roles (sin personas_file ni min_role):
# consulta /uvix/check_permission con el mission_type como operación.
# ADMIN activo y verificado puede solicitar cualquier operación registrada.
# Una operación no registrada se rechaza siempre (CODE_UNKNOWN_OPERATION).
