/**:
  ros__parameters:

    require_enable_button: false

    # -------- LINEAR --------
    axis_linear:
      x: 1

    scale_linear:
      x: -1.5

    scale_linear_turbo:
      x: 1.0

    # -------- ANGULAR --------
    axis_angular:
      yaw: 2

    scale_angular:
      yaw: -2.0

    scale_angular_turbo:
      yaw: 2.0

    # -------- FILTRO --------
    deadzone: 0.05

    enable_button: -1