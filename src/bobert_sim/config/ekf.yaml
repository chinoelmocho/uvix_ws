# config/ekf.yaml
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    reset_on_time_jump: true
    predict_to_current_time: false
    frequency: 40.0
    sensor_timeout: 0.1
    two_d_mode: true        # robot diferencial en plano → ignora z, roll, pitch
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Odometría de ruedas (del diff_drive controller)
    odom0: bobert_base_controller/odom  # <--- USA EL NOMBRE COMPLETO
    odom0_config: [false, false, false,  # x, y, z — NO
                   false, false, false,  # roll, pitch, yaw — NO
                   true,  false, false,  # vx — SÍ
                   false, false, true,   # vyaw — SÍ
                   false, false, false]
    odom0_differential: true             # ← cambia a true
    odom0_relative: false

    # IMU
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,   # orientación — NO (causa deriva)
                  false, false, false,
                  false, false, true,    # vyaw — SÍ
                  false, false, false]   # aceleración — NO
    imu0_differential: false
    imu0_relative: true   
    imu0_remove_gravitational_acceleration: true