controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    uvix_base_controller:
      type: diff_drive_controller/DiffDriveController

uvix_base_controller:
  ros__parameters:
    left_wheel_names: ["base_link_wheel_left_joint"]
    right_wheel_names: ["base_link_wheel_right_joint"]
    wheel_separation: 0.473
    wheel_radius: 0.085
    use_stamped_vel: false
    odom_frame_id: odom
    base_frame_id: base_footprint
    publish_rate: 50.0
    open_loop: false
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 4.0
        has_jerk_limits: false
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 4.0
        has_acceleration_limits: true
        max_acceleration: 2.0

joint_state_broadcaster:
  ros__parameters:
    joints:
      - base_link_wheel_left_joint
      - base_link_wheel_right_joint
      - base_link_rear_caster_right_joint
      - base_link_rear_caster_left_joint
      - base_link_front_caster_right_joint
      - base_link_front_caster_left_joint
      - rear_caster_right_link_rear_road_right_joint
      - rear_caster_left_link_rear_road_left_joint
      - front_caster_right_link_front_road_right_joint
      - front_caster_left_link_front_road_left_joint
